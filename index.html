<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Access Readiness</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }
      #root { min-height: 100vh; padding: 20px; }

      /* CSS variables that the app references */
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f7f7f7;
        --color-background-danger: #fff0f0;
        --color-text-primary: #111111;
        --color-text-secondary: #555555;
        --color-text-tertiary: #999999;
        --color-text-danger: #c0392b;
        --color-border-tertiary: #e0e0e0;
        --color-border-secondary: #cccccc;
        --color-border-danger: #f5c6c6;
        --border-radius-lg: 12px;
        --border-radius-md: 8px;
      }

      input {
        padding: 8px 10px;
        border: 0.5px solid #cccccc;
        border-radius: 8px;
        font-size: 13px;
        outline: none;
        width: 100%;
        background: #ffffff;
        color: #111111;
      }
      input:focus { border-color: #1D9E75; }
      button { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
