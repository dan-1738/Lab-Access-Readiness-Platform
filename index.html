<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Access Readiness</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; font-family: 'IBM Plex Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f7f7; }
      #root { min-height: 100vh; }

      /* CSS variables that the app references */
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f7f7f7;
        --color-background-danger: #fff0f0;
        --color-text-primary: #111111;
        --color-text-secondary: #555555;
        --color-text-tertiary: #999999;
        --color-text-danger: #c0392b;
        --color-border-tertiary: #e0e0e0;
        --color-border-secondary: #cccccc;
        --color-border-danger: #f5c6c6;
        --border-radius-lg: 12px;
        --border-radius-md: 8px;
      }

      input {
        padding: 8px 10px;
        border: 1px solid #cccccc;
        border-radius: 8px;
        font-size: 13px;
        outline: none;
        width: 100%;
        background: #ffffff;
        color: #111111;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }
      input:focus { border-color: #1a5f8f; }
      button { font-family: inherit; }

      /* Responsive shell — desktop persistent sidebar, mobile slide-in drawer,
         same pattern as the LIMS (Layout.jsx): hidden md:flex / mobileOpen overlay. */
      .lar-shell { display: flex; height: 100vh; overflow: hidden; }
      .lar-sidebar-desktop { display: none; }
      .lar-hamburger { display: inline-flex; }
      @media (min-width: 768px) {
        .lar-sidebar-desktop { display: flex; flex-direction: column; flex-shrink: 0; }
        .lar-hamburger { display: none; }
      }lar-mobile-overlay { position: fixed; inset: 0; z-index: 50; display: flex; }
      .lar-mobile-backdrop { flex: 1; background: rgba(0,0,0,0.6); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
